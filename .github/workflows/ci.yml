name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 is a native module; npm ci fetches a prebuild for this Node ABI,
      # or compiles one with the runner's toolchain if none matches.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite spawns real `git` and binds loopback ports. It never invokes the
      # `claude` CLI, a browser, or the network — every agent is the stub engine.
      - name: Test
        run: npm test

      # src/schemas/generated/*.json is committed and derived from the zod schemas.
      # Editing src/config/schema.ts without rerunning `npm run schemas` fails here.
      - name: Generated schemas are up to date
        run: |
          npm run schemas
          git diff --exit-code -- src/schemas/generated \
            || { echo "::error::src/schemas/generated is stale — run 'npm run schemas' and commit the result"; exit 1; }
